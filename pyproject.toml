[project]
name = "toriage"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["server.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1; python_version >= '3.10'",
    "pytest>=9.2.0; python_version >= '3.10'",
    "pytest>=8.4.2; python_version < '3.10'",
    "ruff>=0.17.5",
]
