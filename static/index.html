<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toriage</title>
<style>
  :root {
    color-scheme: light;
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --sidebar: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.97 0 0);
    --good: oklch(0.627 0.194 149.214);
    --warn: oklch(0.769 0.188 70.08);
    --bad: var(--destructive);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.371 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      --sidebar: oklch(0.205 0 0);
      --sidebar-accent: oklch(0.269 0 0);
      --good: oklch(0.723 0.219 149.579);
      --warn: oklch(0.828 0.189 84.429);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font: 14px/1.43 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p, ul, dl, dd { margin: 0; }
  ul { padding-left: 1.25em; }
  svg { flex-shrink: 0; }
  :focus-visible {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }

  .sidebar { display: flex; flex-direction: column; background: var(--sidebar); }
  .sidebar-header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: grid;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar);
  }
  .brand { display: grid; gap: 2px; }
  .brand h1 { font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -0.025em; }
  .brand p { color: var(--muted-foreground); font-size: 13px; }

  .tabs-list {
    display: flex;
    width: 100%;
    height: 36px;
    overflow-x: auto;
    padding: 3px;
    border-radius: var(--radius);
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .tabs-trigger {
    display: inline-flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 100%;
    padding: 4px 6px;
    border: 1px solid transparent;
    border-radius: calc(var(--radius) - 2px);
    background: none;
    color: color-mix(in oklch, var(--foreground) 60%, transparent);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  .tabs-trigger:hover { color: var(--foreground); }
  .tabs-trigger[aria-pressed="true"] {
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-sm);
  }
  .tabs-trigger .count {
    min-width: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: color-mix(in oklch, var(--muted-foreground) 15%, transparent);
    font-size: 12px;
    line-height: 18px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .switch-field { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .switch-field label { cursor: pointer; user-select: none; }
  .switch {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    width: 32px;
    height: 18.4px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--input);
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .switch[aria-checked="true"] { background: var(--primary); }
  .switch-thumb {
    display: block;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--background);
    transition: transform 0.15s;
  }
  .switch[aria-checked="true"] .switch-thumb { transform: translateX(calc(100% - 2px)); }

  .message { margin: 16px; }
  .message[data-kind="loading"] { color: var(--muted-foreground); }
  .message[data-kind="empty"] {
    padding: 32px 16px;
    border: 1px dashed var(--border);
    border-radius: calc(var(--radius) + 4px);
    color: var(--muted-foreground);
    text-align: center;
  }
  .load-error {
    margin: 12px 16px 0;
    padding: 8px 16px;
    border: 1px solid var(--destructive);
    border-radius: var(--radius);
    background: color-mix(in oklch, var(--destructive) 8%, var(--background));
    color: var(--destructive);
    box-shadow: var(--shadow-sm);
  }

  .thread-list { display: grid; align-content: start; gap: 2px; padding: 8px; }
  .thread-list.grouped { gap: 12px; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: calc(var(--radius) - 4px);
    color: var(--muted-foreground);
    font-size: 12px;
    font-weight: 500;
    list-style: none;
    cursor: pointer;
  }
  .group-header::-webkit-details-marker { display: none; }
  .group-header:hover { color: var(--foreground); }
  .group-chevron { transition: transform 0.2s; }
  .group:not([open]) .group-chevron { transform: rotate(-90deg); }
  .group-title { min-width: 0; overflow-wrap: anywhere; }
  .group-name { color: var(--foreground); }
  .group-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  .group-threads { display: grid; gap: 2px; margin-top: 2px; }
  .thread {
    display: grid;
    grid-template-columns: 8px minmax(0, 1fr);
    gap: 2px 10px;
    padding: 8px;
    border: 1px solid transparent;
    border-radius: calc(var(--radius) - 2px);
    color: inherit;
    text-decoration: none;
  }
  .thread:hover { background: var(--sidebar-accent); }
  .thread[aria-current="page"] { background: var(--sidebar-accent); }
  .thread .dot { width: 8px; height: 8px; margin-top: 6px; border-radius: 999px; background: var(--tone); }
  .thread-title {
    display: -webkit-box;
    overflow: hidden;
    font-weight: 500;
    line-height: 1.4;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .thread-meta {
    grid-column: 2;
    color: var(--muted-foreground);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .notices {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 2;
    display: grid;
    gap: 8px;
    width: min(28rem, calc(100% - 32px));
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .notices:empty { display: none; }
  .notices li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 6px 6px 16px;
    border: 1px solid var(--warn);
    border-radius: var(--radius);
    background: color-mix(in oklch, var(--warn) 10%, var(--background));
    box-shadow: var(--shadow-sm);
  }
  .detail-slot { display: flex; flex: 1; flex-direction: column; }
  .detail {
    display: flex;
    flex: 1;
    flex-direction: column;
    width: 100%;
    max-width: 52rem;
    margin: 0 auto;
    padding: 32px 32px 0;
  }
  .back { align-self: flex-start; margin: 0 0 16px -12px; }
  .detail-header { display: grid; gap: 6px; }
  .detail-repo, .stats { color: var(--muted-foreground); }
  .detail-title { font-size: 20px; line-height: 1.4; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .detail-content { display: grid; flex: 1; align-content: start; gap: 20px; margin-top: 28px; padding-bottom: 32px; }
  .detail-content h3 { margin-bottom: 4px; font-size: 14px; font-weight: 500; }
  .detail-content li + li { margin-top: 2px; }
  .detail-actions {
    position: sticky;
    bottom: 0;
    z-index: 1;
    display: grid;
    gap: 12px;
    padding: 12px 0 16px;
    border-top: 1px solid var(--border);
    background: var(--background);
  }
  .detail-actions:has(.decision:not([hidden])) { position: static; }
  .detail-footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .actions, .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links { margin-left: auto; }
  .decision {
    display: grid;
    gap: 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--muted);
  }
  .reason {
    display: block;
    width: 100%;
    min-height: 64px;
    padding: 8px 12px;
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px);
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-xs);
    font: inherit;
    resize: vertical;
  }
  .reason::placeholder { color: var(--muted-foreground); }
  .decision-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .decision-error { color: var(--destructive); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--foreground);
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--tone); }
  [data-tone="good"] { --tone: var(--good); }
  [data-tone="warn"] { --tone: var(--warn); }
  [data-tone="bad"] { --tone: var(--bad); }

  .alert {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 2px 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
  }
  .alert > svg { color: var(--warn); transform: translateY(2px); }
  .alert-title { grid-column: 2; font-weight: 500; letter-spacing: -0.01em; }
  .alert-description { grid-column: 2; color: var(--muted-foreground); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .facts dt { color: var(--muted-foreground); }

  .button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-xs);
    font: inherit;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .button:hover { background: var(--accent); color: var(--accent-foreground); }
  .button.primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
  .button.primary:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  .button.ghost { border-color: transparent; background: none; box-shadow: none; }
  .button.ghost:hover { background: var(--accent); }
  .button:disabled { opacity: 0.5; pointer-events: none; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    .tabs-trigger[aria-pressed="true"] {
      border-color: var(--input);
      background: color-mix(in oklch, var(--input) 30%, transparent);
    }
    .button { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
    .button:hover { background: color-mix(in oklch, var(--input) 50%, transparent); }
    .switch[aria-checked="false"] { background: color-mix(in oklch, var(--input) 80%, transparent); }
    .switch[aria-checked="false"] .switch-thumb { background: var(--foreground); }
    .switch[aria-checked="true"] .switch-thumb { background: var(--primary-foreground); }
  }
  .switch:focus-visible,
  .tabs-trigger:focus-visible,
  .button:focus-visible,
  .reason:focus-visible,
  .thread:focus-visible,
  .group-header:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (min-width: 768px) {
    body { height: 100vh; height: 100dvh; overflow: hidden; }
    .app {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
    }
    .load-error { grid-column: 1 / -1; margin-bottom: 12px; }
    .sidebar, .main { grid-row: 2; }
    .sidebar { min-height: 0; overflow-y: auto; border-right: 1px solid var(--border); }
    .main { min-height: 0; overflow-y: auto; }
    .back { display: none; }
  }
  @media not all and (min-width: 768px) {
    .sidebar { min-height: 100vh; min-height: 100dvh; }
    .app[data-view="list"] .main,
    .app[data-view="detail"] .sidebar { display: none; }
    .detail { padding: 16px 16px 0; }
    .actions, .links { width: 100%; }
    .detail-footer .button { flex: 1; justify-content: center; }
    .facts { grid-template-columns: 1fr; gap: 2px; }
    .facts dd + dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="app" data-view="list">
  <p id="load-error" class="load-error" role="alert" hidden></p>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <h1>toriage</h1>
        <p>Claude Code が作った PR を読み、レビューに出すかを決める</p>
      </div>
      <nav class="tabs-list" aria-label="判断の状態">
        <button type="button" class="tabs-trigger" data-status="pending" aria-pressed="true">未判断<span class="count"></span></button>
        <button type="button" class="tabs-trigger" data-status="on_hold" aria-pressed="false">保留<span class="count"></span></button>
        <button type="button" class="tabs-trigger" data-status="requested" aria-pressed="false">依頼済み<span class="count"></span></button>
        <button type="button" class="tabs-trigger" data-status="returned" aria-pressed="false">差し戻し<span class="count"></span></button>
      </nav>
      <div class="switch-field">
        <button type="button" role="switch" id="group-by-project" class="switch" aria-checked="true"><span class="switch-thumb"></span></button>
        <label for="group-by-project">プロジェクトごとにまとめる</label>
      </div>
    </div>
    <p id="message" class="message" role="status" data-kind="loading">読み込み中…</p>
    <nav id="threads" class="thread-list" aria-label="PR の一覧"></nav>
  </aside>
  <main class="main">
    <div id="detail" class="detail-slot"></div>
  </main>
  <ul id="notices" class="notices" role="status"></ul>
</div>
<template id="group-template">
  <details class="group" open>
    <summary class="group-header">
      <svg class="group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <span class="group-title"><span class="group-owner"></span><span class="group-name"></span></span>
      <span class="group-count"></span>
    </summary>
    <div class="group-threads"></div>
  </details>
</template>
<template id="thread-template">
  <a class="thread">
    <span class="dot" aria-hidden="true"></span>
    <span class="thread-title"></span>
    <span class="thread-meta"></span>
  </a>
</template>
<template id="detail-template">
  <article class="detail">
    <button type="button" class="button ghost back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      一覧に戻る
    </button>
    <header class="detail-header">
      <p class="detail-repo"><span class="repo-name"></span> <span class="number"></span></p>
      <h2 class="detail-title title"></h2>
      <p class="stats"></p>
      <div class="detail-badges">
        <span class="badge risk"><span class="dot"></span><span class="label"></span></span>
        <span class="badge tests"><span class="dot"></span><span class="label"></span></span>
      </div>
    </header>
    <div class="detail-content">
      <section>
        <h3>変更内容</h3>
        <ul class="summary"></ul>
      </section>
      <section>
        <h3>目的</h3>
        <p class="why"></p>
      </section>
      <div class="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <p class="alert-title">気になる点</p>
        <ul class="alert-description concerns"></ul>
      </div>
      <dl class="facts">
        <dt>リスクの理由</dt>
        <dd class="risk-reason"></dd>
        <dt>テスト</dt>
        <dd class="tests-detail"></dd>
      </dl>
    </div>
    <div class="detail-actions">
      <div class="detail-footer">
        <div class="actions">
          <button type="button" class="button primary" data-action="request-review">レビュー依頼</button>
          <button type="button" class="button" data-action="return">差し戻し</button>
          <button type="button" class="button ghost" data-action="hold">保留</button>
        </div>
        <div class="links">
          <a class="button pr-link" target="_blank" rel="noopener noreferrer">GitHub で開く<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
          <a class="button artifact-link" target="_blank" rel="noopener noreferrer">変更説明を開く<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
        </div>
      </div>
      <div class="decision" hidden>
        <p class="decision-text"></p>
        <textarea class="reason" rows="3" aria-label="差し戻す理由" placeholder="直してほしいことを書く(PR を作った Claude に渡します)"></textarea>
        <div class="decision-buttons">
          <button type="button" class="button" data-cancel>やめる</button>
          <button type="button" class="button primary" data-confirm></button>
        </div>
      </div>
      <p class="decision-error" role="alert" hidden></p>
    </div>
  </article>
</template>
<script>
  const RISKS = {
    low: { label: "リスク 低", tone: "good" },
    medium: { label: "リスク 中", tone: "warn" },
    high: { label: "リスク 高", tone: "bad" },
  };
  const TESTS = {
    passed: { label: "テスト 成功", tone: "good" },
    failed: { label: "テスト 失敗", tone: "bad" },
    not_run: { label: "テスト 未実行", tone: "warn" },
  };
  const CONFIRMATIONS = {
    "request-review": {
      label: "レビューに出す",
      text: (triage) =>
        triage.reviewers.length
          ? `Draft を外し、${triage.reviewers.join("、")} にレビューを頼みます。`
          : "Draft を外して Ready にします。レビュアーの候補はいません。",
    },
    return: {
      label: "差し戻す",
      text: () => "PR を作った Claude の会話を裏で再開し、理由を渡して直してもらいます。PR にはコメントしません。",
    },
  };
  const receivedFormat = new Intl.DateTimeFormat("ja-JP", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
  const ageFormat = new Intl.RelativeTimeFormat("ja", { numeric: "auto" });
  const SELECTION = /^#pr-([0-9]+)$/;
  const app = document.querySelector(".app");
  const main = document.querySelector(".main");
  const tabs = [...document.querySelectorAll(".tabs-trigger")];
  const threads = document.getElementById("threads");
  const detailSlot = document.getElementById("detail");
  const message = document.getElementById("message");
  const notices = document.getElementById("notices");
  const loadErrorBox = document.getElementById("load-error");
  const groupTemplate = document.getElementById("group-template");
  const threadTemplate = document.getElementById("thread-template");
  const detailTemplate = document.getElementById("detail-template");
  const groupSwitch = document.getElementById("group-by-project");
  const wide = window.matchMedia("(min-width: 768px)");
  const GROUPING_KEY = "toriage:group-by-project";
  let selectedStatus = "pending";
  let selectedId = null;
  let shownId = null;
  let openedFromList = false;
  let listScroll = 0;
  let advance = null;
  let followSelectionOnLoad = true;
  let triages = [];
  let latestRequest = 0;
  let lastResponse = "";
  let loadError = "";
  let groupByProject = true;
  const collapsedProjects = new Set();
  const drafts = new Map();
  const runningDecisions = new Set();

  function applyGrouping(value) {
    groupByProject = value;
    groupSwitch.setAttribute("aria-checked", String(value));
  }

  function projectKey(status, repo) {
    return `${status} ${repo}`;
  }

  function updateViewState(previouslyReceived) {
    const byId = new Map(triages.map((triage) => [triage.id, triage]));
    const keys = new Set(triages.map((triage) => projectKey(triage.status, triage.report.repo)));
    for (const key of collapsedProjects) {
      if (!keys.has(key)) {
        collapsedProjects.delete(key);
      }
    }
    for (const [id, draft] of drafts) {
      if (!byId.get(id)?.actions.includes(draft.action)) {
        drafts.delete(id);
      }
    }
    for (const triage of triages) {
      if (previouslyReceived.get(triage.id) !== triage.received_at) {
        collapsedProjects.delete(projectKey(triage.status, triage.report.repo));
      }
    }
  }

  function followSelection() {
    const match = SELECTION.exec(location.hash);
    selectedId = match ? Number(match[1]) : null;
    const selected = triages.find((triage) => triage.id === selectedId);
    if (selected) {
      selectedStatus = selected.status;
    } else if (selectedId !== null) {
      selectQuietly(null);
    }
  }

  function selectQuietly(id) {
    selectedId = id;
    history.replaceState(null, "", id === null ? `${location.pathname}${location.search}` : `#pr-${id}`);
  }

  function shownIn(status) {
    return triages.filter((triage) => triage.status === status);
  }

  function orderedIn(status) {
    const shown = shownIn(status);
    return groupByProject ? shown.sort((a, b) => a.report.repo.localeCompare(b.report.repo)) : shown;
  }

  function hiddenIn(status, triage) {
    return groupByProject && collapsedProjects.has(projectKey(status, triage.report.repo));
  }

  function moveOnFromDecided() {
    const { id, status, following, preceding } = advance;
    advance = null;
    if (shownIn(status).some((shown) => shown.id === id)) {
      return;
    }
    if (status !== selectedStatus || (selectedId !== id && selectedId !== null)) {
      return;
    }
    const visible = new Set(
      shownIn(status)
        .filter((shown) => !hiddenIn(status, shown))
        .map((shown) => shown.id),
    );
    selectQuietly([...following, ...preceding].find((candidate) => visible.has(candidate)) ?? null);
  }

  function readGrouping() {
    try {
      return localStorage.getItem(GROUPING_KEY) !== "false";
    } catch (error) {
      console.warn("まとめ方を読み出せませんでした", error);
      return true;
    }
  }

  function rememberGrouping() {
    try {
      localStorage.setItem(GROUPING_KEY, String(groupByProject));
    } catch (error) {
      console.warn("まとめ方を保存できませんでした", error);
    }
  }

  function setText(element, selector, text) {
    element.querySelector(selector).textContent = text;
  }

  function setBadge(element, selector, { label, tone }) {
    const badge = element.querySelector(selector);
    badge.querySelector(".label").textContent = label;
    badge.dataset.tone = tone;
  }

  function setItems(element, selector, items) {
    element.querySelector(selector).replaceChildren(
      ...items.map((item) => Object.assign(document.createElement("li"), { textContent: item })),
    );
  }

  function setMessage(kind, text) {
    message.dataset.kind = kind;
    message.textContent = text;
    message.hidden = text === "";
  }

  function addNotice(triage, text) {
    const item = document.createElement("li");
    const close = Object.assign(document.createElement("button"), {
      type: "button",
      className: "button ghost",
      textContent: "閉じる",
    });
    close.addEventListener("click", () => item.remove());
    item.append(
      Object.assign(document.createElement("span"), {
        textContent: `${triage.repo}#${triage.number}: ${text}`,
      }),
      close,
    );
    notices.prepend(item);
  }

  function ageOf(receivedAt) {
    const minutes = Math.round((Date.now() - new Date(receivedAt)) / 60000);
    if (minutes < 1) {
      return "たった今";
    }
    if (minutes < 60) {
      return ageFormat.format(-minutes, "minute");
    }
    const hours = Math.round(minutes / 60);
    if (hours < 24) {
      return ageFormat.format(-hours, "hour");
    }
    return ageFormat.format(-Math.round(hours / 24), "day");
  }

  function renderThread(triage, highlighted) {
    const thread = threadTemplate.content.firstElementChild.cloneNode(true);
    const { report } = triage;
    const risk = RISKS[report.risk];
    thread.href = `#pr-${triage.id}`;
    thread.dataset.tone = risk.tone;
    if (triage === highlighted) {
      thread.setAttribute("aria-current", "page");
    }
    setText(thread, ".thread-title", report.title);
    setText(
      thread,
      ".thread-meta",
      [groupByProject ? `#${report.number}` : `${report.repo} #${report.number}`, risk.label, ageOf(triage.received_at)].join(" · "),
    );
    return thread;
  }

  function renderGroup(repo, rows, key) {
    const group = groupTemplate.content.firstElementChild.cloneNode(true);
    const slash = repo.indexOf("/");
    group.open = !collapsedProjects.has(key);
    group.addEventListener("toggle", () => {
      if (group.open !== collapsedProjects.has(key)) {
        return;
      }
      if (group.open) {
        collapsedProjects.delete(key);
      } else {
        collapsedProjects.add(key);
      }
      render();
    });
    group.dataset.key = key;
    setText(group, ".group-owner", repo.slice(0, slash + 1));
    setText(group, ".group-name", repo.slice(slash + 1));
    setText(group, ".group-count", rows.length);
    group.querySelector(".group-threads").replaceChildren(...rows);
    return group;
  }

  function renderGroups(ordered, highlighted) {
    const projects = new Map();
    for (const triage of ordered) {
      const repo = triage.report.repo;
      if (!projects.has(repo)) {
        projects.set(repo, []);
      }
      projects.get(repo).push(triage);
    }
    return [...projects].map(([repo, members]) =>
      renderGroup(
        repo,
        members.map((triage) => renderThread(triage, highlighted)),
        projectKey(selectedStatus, repo),
      ),
    );
  }

  function renderDetail(triage) {
    const detail = detailTemplate.content.firstElementChild.cloneNode(true);
    const { report } = triage;
    const { changes } = report;
    detail.dataset.id = triage.id;
    detail.querySelector(".back").addEventListener("click", () => {
      if (openedFromList) {
        history.back();
        return;
      }
      selectQuietly(null);
      render();
    });
    setText(detail, ".repo-name", report.repo);
    setText(detail, ".number", `#${report.number}`);
    setText(detail, ".title", report.title);
    setText(
      detail,
      ".stats",
      `+${changes.additions} −${changes.deletions} · ${changes.files} ファイル · ${report.branch} · ${receivedFormat.format(new Date(triage.received_at))} 受信`,
    );
    setBadge(detail, ".risk", RISKS[report.risk]);
    setBadge(detail, ".tests", TESTS[report.tests.status]);
    setItems(detail, ".summary", report.summary);
    setText(detail, ".why", report.why);
    setItems(detail, ".concerns", report.concerns.length ? report.concerns : ["なし"]);
    setText(detail, ".risk-reason", report.risk_reason);
    setText(detail, ".tests-detail", report.tests.detail);
    detail.querySelector(".pr-link").href = report.url;
    const artifactLink = detail.querySelector(".artifact-link");
    if (report.artifact_url) {
      artifactLink.href = report.artifact_url;
    } else {
      artifactLink.remove();
    }
    setUpDecisions(detail, triage);
    return detail;
  }

  async function postDecision(triage, action, reason) {
    const response = await fetch(`/api/prs/${triage.id}/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seen: triage.received_at, reason }),
    });
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      throw new Error(problem.error ?? `HTTP ${response.status}`);
    }
    return response.json();
  }

  async function decideOn(triage) {
    const draft = drafts.get(triage.id);
    const status = selectedStatus;
    const order = orderedIn(status).map((shown) => shown.id);
    const index = order.indexOf(triage.id);
    draft.error = "";
    runningDecisions.add(triage.id);
    render();
    try {
      const decision = await postDecision(triage, draft.action, draft.reason);
      advance = {
        id: triage.id,
        status,
        following: order.slice(index + 1),
        preceding: order.slice(0, index).reverse(),
      };
      drafts.delete(triage.id);
      if (decision.warning) {
        addNotice(triage, decision.warning);
      }
    } catch (problem) {
      draft.error = `できませんでした: ${problem.message}`;
    } finally {
      runningDecisions.delete(triage.id);
    }
    await refresh();
    if (draft.error && !drafts.has(triage.id)) {
      addNotice(triage, draft.error);
    }
    render();
  }

  function setUpDecisions(detail, triage) {
    const actions = detail.querySelector(".actions");
    const panel = detail.querySelector(".decision");
    const reason = panel.querySelector(".reason");
    const confirm = panel.querySelector("[data-confirm]");
    const error = detail.querySelector(".decision-error");
    if (triage.actions.length === 0) {
      actions.remove();
      panel.remove();
      error.remove();
      return;
    }
    for (const button of actions.querySelectorAll("button")) {
      if (!triage.actions.includes(button.dataset.action)) {
        button.remove();
      }
    }
    for (const button of detail.querySelectorAll(".actions button, .decision button")) {
      button.disabled = runningDecisions.has(triage.id);
    }

    function showDraft() {
      const draft = drafts.get(triage.id);
      error.textContent = draft?.error ?? "";
      error.hidden = !draft?.error;
      panel.hidden = !draft || draft.action === "hold";
      if (panel.hidden) {
        return;
      }
      setText(panel, ".decision-text", CONFIRMATIONS[draft.action].text(triage));
      confirm.textContent = CONFIRMATIONS[draft.action].label;
      reason.hidden = draft.action !== "return";
      reason.value = draft.reason;
    }

    for (const button of actions.querySelectorAll("button")) {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        drafts.set(triage.id, { action, reason: drafts.get(triage.id)?.reason ?? "", error: "" });
        if (action === "hold") {
          decideOn(triage);
          return;
        }
        showDraft();
        (action === "return" ? reason : confirm).focus();
      });
    }
    reason.addEventListener("input", () => {
      drafts.get(triage.id).reason = reason.value;
    });
    confirm.addEventListener("click", () => decideOn(triage));
    panel.querySelector("[data-cancel]").addEventListener("click", () => {
      drafts.delete(triage.id);
      showDraft();
    });
    showDraft();
  }

  function render() {
    const focused = document.activeElement;
    const focusedThread = focused?.classList.contains("thread") ? focused.getAttribute("href") : null;
    const focusedGroup = focused?.classList.contains("group-header") ? focused.closest(".group").dataset.key : null;
    const typing = focused?.classList.contains("reason")
      ? {
          id: document.activeElement.closest(".detail").dataset.id,
          start: document.activeElement.selectionStart,
          end: document.activeElement.selectionEnd,
        }
      : null;
    for (const tab of tabs) {
      const status = tab.dataset.status;
      tab.setAttribute("aria-pressed", String(status === selectedStatus));
      tab.querySelector(".count").textContent = shownIn(status).length;
    }
    const shown = orderedIn(selectedStatus);
    const chosen = shown.find((triage) => triage.id === selectedId) ?? null;
    const newestFirst = shownIn(selectedStatus);
    const current =
      chosen ?? newestFirst.find((triage) => !hiddenIn(selectedStatus, triage)) ?? newestFirst[0] ?? null;
    const highlighted = chosen || wide.matches ? current : null;
    const view = chosen ? "detail" : "list";
    const viewChanged = app.dataset.view !== view;
    const currentChanged = current?.id !== shownId;
    app.dataset.view = view;
    if (view === "list") {
      openedFromList = false;
    }
    threads.className = groupByProject ? "thread-list grouped" : "thread-list";
    threads.replaceChildren(
      ...(groupByProject
        ? renderGroups(shown, highlighted)
        : shown.map((triage) => renderThread(triage, highlighted))),
    );
    if (focusedThread) {
      threads.querySelector(`.thread[href="${CSS.escape(focusedThread)}"]`)?.focus();
    }
    if (focusedGroup) {
      [...threads.querySelectorAll(".group")]
        .find((group) => group.dataset.key === focusedGroup)
        ?.querySelector(".group-header")
        .focus();
    }
    detailSlot.replaceChildren(...(current ? [renderDetail(current)] : []));
    shownId = current?.id;
    if (currentChanged) {
      main.scrollTop = 0;
    }
    if (viewChanged && view === "list") {
      window.scrollTo(0, listScroll);
    } else if (view === "detail" && (viewChanged || currentChanged)) {
      window.scrollTo(0, 0);
    }
    const reason = typing && detailSlot.querySelector(`.detail[data-id="${typing.id}"] .reason`);
    if (reason && !reason.hidden) {
      reason.focus();
      reason.setSelectionRange(typing.start, typing.end);
    }
    loadErrorBox.textContent = loadError ? `読み込めませんでした: ${loadError}` : "";
    loadErrorBox.hidden = !loadError;
    setMessage("empty", loadError || shown.length ? "" : "このタブに PR はありません");
  }

  async function refresh() {
    const request = ++latestRequest;
    try {
      const response = await fetch("/api/prs");
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const text = await response.text();
      if (request !== latestRequest || (text === lastResponse && !loadError)) {
        return;
      }
      const previouslyReceived = new Map(triages.map((triage) => [triage.id, triage.received_at]));
      lastResponse = text;
      triages = JSON.parse(text);
      loadError = "";
      updateViewState(previouslyReceived);
      if (followSelectionOnLoad) {
        followSelectionOnLoad = false;
        followSelection();
      }
      if (advance) {
        moveOnFromDecided();
      }
      if (selectedId !== null && triages.find((triage) => triage.id === selectedId)?.status !== selectedStatus) {
        selectQuietly(null);
      }
      render();
    } catch (error) {
      if (request !== latestRequest) {
        return;
      }
      loadError = error.message;
      render();
    }
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => {
      selectedStatus = tab.dataset.status;
      selectQuietly(null);
      render();
    });
  }
  applyGrouping(readGrouping());
  groupSwitch.addEventListener("click", () => {
    applyGrouping(!groupByProject);
    rememberGrouping();
    render();
  });
  window.addEventListener("storage", (event) => {
    if (event.key === GROUPING_KEY) {
      applyGrouping(event.newValue !== "false");
      render();
    }
  });
  threads.addEventListener("click", (event) => {
    if (event.target.closest(".thread") && !wide.matches) {
      openedFromList = true;
      listScroll = window.scrollY;
    }
  });
  wide.addEventListener("change", render);
  window.addEventListener("hashchange", () => {
    if (followSelectionOnLoad) {
      return;
    }
    followSelection();
    render();
  });
  window.addEventListener("focus", refresh);
  refresh();
</script>
</body>
</html>
