<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRトリアージ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6a6964;
    --line: #dcdbd6;
    --accent: #2f6fdb;
    --good: #2f855a;
    --warn: #c48a1c;
    --bad: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --surface: #1f1f1d;
      --text: #ecebe6;
      --muted: #a3a29c;
      --line: #3a3936;
      --accent: #6b9cf0;
      --good: #5fbf86;
      --warn: #e0a84a;
      --bad: #f07575;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header, main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 24px;
    padding-bottom: 16px;
  }
  h1 { margin: 0; font-size: 20px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  nav button {
    font: inherit;
    padding: 3px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  nav button[aria-pressed="true"] {
    border: 2px solid var(--accent);
    padding: 2px 13px;
    color: var(--text);
    font-weight: 600;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  #message { color: var(--muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .card > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .card > summary::-webkit-details-marker { display: none; }
  .repo { color: var(--muted); font-size: 13px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; grid-row: span 2; align-self: start; }
  .title { font-weight: 600; font-size: 17px; }
  .badge {
    font-size: 13px;
    padding: 1px 10px;
    border-radius: 999px;
    border: 1px solid var(--tone);
    background: color-mix(in srgb, var(--tone) 12%, transparent);
    white-space: nowrap;
  }
  .badge[data-tone="good"] { --tone: var(--good); }
  .badge[data-tone="warn"] { --tone: var(--warn); }
  .badge[data-tone="bad"] { --tone: var(--bad); }
  .body { padding: 0 20px 20px; }
  .stats { color: var(--muted); font-size: 13px; margin: 0; }
  h2 { font-size: 13px; color: var(--muted); margin: 16px 0 2px; }
  p { margin: 0; }
  ul { margin: 0; padding-left: 1.2em; }
  .notes {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    margin: 16px 0 0;
    padding: 12px 16px;
    border: 1px solid var(--warn);
    border-radius: 8px;
    background: color-mix(in srgb, var(--warn) 10%, transparent);
  }
  .notes dt { font-weight: 600; font-size: 13px; padding-top: 2px; }
  .notes dd { margin: 0; }
  .links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 20px; margin-top: 16px; }
  a { color: var(--accent); }
  @media (max-width: 520px) {
    .card > summary { grid-template-columns: 1fr; }
    .badges { grid-row: auto; order: 3; }
    .notes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>PRトリアージ</h1>
  <nav aria-label="判断の状態">
    <button type="button" data-status="pending" aria-pressed="true">未判断</button>
    <button type="button" data-status="on_hold" aria-pressed="false">保留</button>
    <button type="button" data-status="requested" aria-pressed="false">依頼済み</button>
    <button type="button" data-status="returned" aria-pressed="false">差し戻し</button>
  </nav>
</header>
<main>
  <p id="message" role="status"></p>
  <div id="cards"></div>
</main>
<template id="card-template">
  <details class="card">
    <summary>
      <span class="repo"></span>
      <span class="badges"><span class="badge risk"></span><span class="badge tests"></span></span>
      <span class="title"></span>
    </summary>
    <div class="body">
      <p class="stats"></p>
      <h2>変更内容</h2>
      <ul class="summary"></ul>
      <h2>目的</h2>
      <p class="why"></p>
      <dl class="notes">
        <dt>気になる点</dt>
        <dd><ul class="concerns"></ul></dd>
        <dt>リスクの理由</dt>
        <dd class="risk-reason"></dd>
        <dt>テスト</dt>
        <dd class="tests-detail"></dd>
      </dl>
      <p class="links">
        <a class="pr-link" target="_blank" rel="noopener noreferrer">GitHubで開く ↗</a>
        <a class="artifact-link" target="_blank" rel="noopener noreferrer">変更説明を開く ↗</a>
      </p>
    </div>
  </details>
</template>
<script>
  const RISKS = {
    low: { label: "リスク：低", tone: "good" },
    medium: { label: "リスク：中", tone: "warn" },
    high: { label: "リスク：高", tone: "bad" },
  };
  const TESTS = {
    passed: { label: "テスト：成功", tone: "good" },
    failed: { label: "テスト：失敗", tone: "bad" },
    not_run: { label: "テスト：未実行", tone: "warn" },
  };
  const receivedFormat = new Intl.DateTimeFormat("ja-JP", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
  const tabs = [...document.querySelectorAll("nav button")];
  const cards = document.getElementById("cards");
  const message = document.getElementById("message");
  const template = document.getElementById("card-template");

  function setText(card, selector, text) {
    card.querySelector(selector).textContent = text;
  }

  function setBadge(card, selector, { label, tone }) {
    const badge = card.querySelector(selector);
    badge.textContent = label;
    badge.dataset.tone = tone;
  }

  function setItems(card, selector, items) {
    const list = card.querySelector(selector);
    list.replaceChildren(
      ...items.map((item) => Object.assign(document.createElement("li"), { textContent: item })),
    );
  }

  function renderCard({ report, received_at }, open) {
    const card = template.content.firstElementChild.cloneNode(true);
    const { changes } = report;
    card.open = open;
    setText(card, ".repo", `${report.repo} #${report.number}`);
    setText(card, ".title", report.title);
    setBadge(card, ".risk", RISKS[report.risk]);
    setBadge(card, ".tests", TESTS[report.tests.status]);
    setText(
      card,
      ".stats",
      `+${changes.additions} −${changes.deletions} ・ ${changes.files}ファイル ・ ${report.branch} ・ ${receivedFormat.format(new Date(received_at))} 受信`,
    );
    setItems(card, ".summary", report.summary);
    setText(card, ".why", report.why);
    setItems(card, ".concerns", report.concerns.length ? report.concerns : ["なし"]);
    setText(card, ".risk-reason", report.risk_reason);
    setText(card, ".tests-detail", report.tests.detail);
    card.querySelector(".pr-link").href = report.url;
    const artifactLink = card.querySelector(".artifact-link");
    if (report.artifact_url) {
      artifactLink.href = report.artifact_url;
    } else {
      artifactLink.remove();
    }
    return card;
  }

  async function show(status) {
    for (const tab of tabs) {
      tab.setAttribute("aria-pressed", String(tab.dataset.status === status));
    }
    message.textContent = "読み込み中…";
    try {
      const response = await fetch(`/api/prs?status=${status}`);
      if (!response.ok) {
        const problem = await response.json().catch(() => ({}));
        throw new Error(problem.error ?? `HTTP ${response.status}`);
      }
      const triages = await response.json();
      cards.replaceChildren(...triages.map((triage, index) => renderCard(triage, index === 0)));
      message.textContent = triages.length ? "" : "このタブにPRはありません";
    } catch (error) {
      cards.replaceChildren();
      message.textContent = `読み込めませんでした: ${error.message}`;
    }
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => show(tab.dataset.status));
  }
  show("pending");
</script>
</body>
</html>
