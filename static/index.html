<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRトリアージ</title>
<style>
  :root {
    color-scheme: light;
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --good: oklch(0.627 0.194 149.214);
    --warn: oklch(0.769 0.188 70.08);
    --bad: var(--destructive);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.371 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      --good: oklch(0.723 0.219 149.579);
      --warn: oklch(0.828 0.189 84.429);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font: 14px/1.43 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p, ul, dl, dd { margin: 0; }
  ul { padding-left: 1.25em; }
  svg { flex-shrink: 0; }
  :focus-visible {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }

  .page { max-width: 48rem; margin: 0 auto; padding: 40px 16px 64px; }
  .page-header { display: grid; gap: 4px; margin-bottom: 24px; }
  .page-header h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em; }
  .page-header p { color: var(--muted-foreground); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    margin-bottom: 16px;
  }
  .tabs-list {
    display: inline-flex;
    height: 36px;
    max-width: 100%;
    overflow-x: auto;
    padding: 3px;
    border-radius: var(--radius);
    background: var(--muted);
    color: var(--muted-foreground);
  }
  .tabs-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 100%;
    padding: 4px 10px;
    border: 1px solid transparent;
    border-radius: calc(var(--radius) - 2px);
    background: none;
    color: color-mix(in oklch, var(--foreground) 60%, transparent);
    font: inherit;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.15s, background-color 0.15s, box-shadow 0.15s;
  }
  .tabs-trigger:hover { color: var(--foreground); }
  .tabs-trigger[aria-pressed="true"] {
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-sm);
  }
  .tabs-trigger .count {
    min-width: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: color-mix(in oklch, var(--muted-foreground) 15%, transparent);
    font-size: 12px;
    line-height: 18px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .switch-field { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  .switch-field label { cursor: pointer; user-select: none; }
  .switch {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    width: 32px;
    height: 18.4px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--input);
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .switch[aria-checked="true"] { background: var(--primary); }
  .switch-thumb {
    display: block;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--background);
    transition: transform 0.15s;
  }
  .switch[aria-checked="true"] .switch-thumb { transform: translateX(calc(100% - 2px)); }

  .notice {
    margin: 0 0 16px;
    padding: 12px 16px;
    border: 1px solid var(--warn);
    border-radius: var(--radius);
    background: color-mix(in oklch, var(--warn) 10%, transparent);
  }
  .message[data-kind="loading"] { color: var(--muted-foreground); }
  .message[data-kind="empty"] {
    padding: 48px 24px;
    border: 1px dashed var(--border);
    border-radius: calc(var(--radius) + 4px);
    color: var(--muted-foreground);
    text-align: center;
  }
  .message[data-kind="error"] {
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--destructive);
  }

  .card-list { display: grid; gap: 16px; }
  .project-list { display: grid; gap: 28px; }
  .project .repo-name { display: none; }
  .project-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
    border-radius: calc(var(--radius) - 4px);
    list-style: none;
    cursor: pointer;
  }
  .project-header::-webkit-details-marker { display: none; }
  .project-chevron { color: var(--muted-foreground); transition: transform 0.2s; }
  .project:not([open]) .project-chevron { transform: rotate(-90deg); }
  .project-title { min-width: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .project-owner { color: var(--muted-foreground); font-weight: 400; }
  .project-count {
    min-width: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    font-size: 12px;
    line-height: 20px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .project-cards { margin-top: 12px; }
  .card {
    padding: 24px 0;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px);
    background: var(--card);
    color: var(--card-foreground);
    box-shadow: var(--shadow-sm);
  }
  .card:has(> .card-header:focus-visible) {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .card-header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 6px 16px;
    padding: 0 24px;
    list-style: none;
    cursor: pointer;
  }
  .card-header::-webkit-details-marker { display: none; }
  .card-header:focus-visible { box-shadow: none; }
  .card-title { font-size: 16px; line-height: 1.4; font-weight: 600; }
  .card-description { color: var(--muted-foreground); }
  .card-action {
    grid-column: 2;
    grid-row: 1 / span 3;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
  }
  .chevron { color: var(--muted-foreground); transition: transform 0.2s; }
  .card[open] .chevron { transform: rotate(180deg); }
  .card-content { display: grid; gap: 20px; margin-top: 24px; padding: 0 24px; }
  .card-content h2 { margin-bottom: 4px; font-size: 14px; font-weight: 500; }
  .card-content li + li { margin-top: 2px; }
  .card-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    margin-top: 24px;
    padding: 0 24px;
  }
  .actions, .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links { margin-left: auto; }
  .decision {
    display: grid;
    gap: 12px;
    margin: 16px 24px 0;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--muted);
  }
  .reason {
    display: block;
    width: 100%;
    min-height: 64px;
    padding: 8px 12px;
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px);
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-xs);
    font: inherit;
    resize: vertical;
  }
  .reason::placeholder { color: var(--muted-foreground); }
  .decision-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .decision-error { margin: 12px 24px 0; color: var(--destructive); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--foreground);
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--tone); }
  [data-tone="good"] { --tone: var(--good); }
  [data-tone="warn"] { --tone: var(--warn); }
  [data-tone="bad"] { --tone: var(--bad); }

  .alert {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 2px 12px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
  }
  .alert > svg { color: var(--warn); transform: translateY(2px); }
  .alert-title { grid-column: 2; font-weight: 500; letter-spacing: -0.01em; }
  .alert-description { grid-column: 2; color: var(--muted-foreground); }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .facts dt { color: var(--muted-foreground); }

  .button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    background: var(--background);
    color: var(--foreground);
    box-shadow: var(--shadow-xs);
    font: inherit;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .button:hover { background: var(--accent); color: var(--accent-foreground); }
  .button.primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
  .button.primary:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  .button.ghost { border-color: transparent; background: none; box-shadow: none; }
  .button.ghost:hover { background: var(--accent); }
  .button:disabled { opacity: 0.5; pointer-events: none; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    .tabs-trigger[aria-pressed="true"] {
      border-color: var(--input);
      background: color-mix(in oklch, var(--input) 30%, transparent);
    }
    .button { border-color: var(--input); background: color-mix(in oklch, var(--input) 30%, transparent); }
    .button:hover { background: color-mix(in oklch, var(--input) 50%, transparent); }
    .switch[aria-checked="false"] { background: color-mix(in oklch, var(--input) 80%, transparent); }
    .switch[aria-checked="false"] .switch-thumb { background: var(--foreground); }
    .switch[aria-checked="true"] .switch-thumb { background: var(--primary-foreground); }
  }
  .switch:focus-visible,
  .tabs-trigger:focus-visible,
  .button:focus-visible,
  .reason:focus-visible,
  .project-header:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 560px) {
    .page { padding-top: 24px; }
    .tabs-list { display: flex; width: 100%; }
    .tabs-trigger { flex: 1; justify-content: center; gap: 4px; padding: 4px 6px; font-size: 13px; }
    .actions, .links { width: 100%; }
    .card-footer .button { flex: 1; justify-content: center; }
    .card-header { grid-template-columns: 1fr; }
    .card-action { grid-column: 1; grid-row: auto; justify-content: flex-start; order: 4; }
    .facts { grid-template-columns: 1fr; gap: 2px; }
    .facts dd + dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>PRトリアージ</h1>
    <p>Claude Code が作った PR を読み、レビューに出すかを決める</p>
  </header>
  <div class="toolbar">
    <nav class="tabs-list" aria-label="判断の状態">
      <button type="button" class="tabs-trigger" data-status="pending" aria-pressed="true">未判断<span class="count"></span></button>
      <button type="button" class="tabs-trigger" data-status="on_hold" aria-pressed="false">保留<span class="count"></span></button>
      <button type="button" class="tabs-trigger" data-status="requested" aria-pressed="false">依頼済み<span class="count"></span></button>
      <button type="button" class="tabs-trigger" data-status="returned" aria-pressed="false">差し戻し<span class="count"></span></button>
    </nav>
    <div class="switch-field">
      <button type="button" role="switch" id="group-by-project" class="switch" aria-checked="true"><span class="switch-thumb"></span></button>
      <label for="group-by-project">プロジェクトごとにまとめる</label>
    </div>
  </div>
  <p id="notice" class="notice" role="status" hidden></p>
  <p id="message" class="message" role="status" data-kind="loading">読み込み中…</p>
  <div id="cards" class="card-list"></div>
</div>
<template id="project-template">
  <details class="project" open>
    <summary class="project-header">
      <svg class="project-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <span class="project-title"><span class="project-owner"></span><span class="project-name"></span></span>
      <span class="project-count"></span>
    </summary>
    <div class="project-cards card-list"></div>
  </details>
</template>
<template id="card-template">
  <details class="card">
    <summary class="card-header">
      <span class="card-description"><span class="repo-name"></span> <span class="number"></span></span>
      <span class="card-action">
        <span class="badge risk"><span class="dot"></span><span class="label"></span></span>
        <span class="badge tests"><span class="dot"></span><span class="label"></span></span>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </span>
      <span class="card-title title"></span>
      <span class="card-description stats"></span>
    </summary>
    <div class="card-content">
      <section>
        <h2>変更内容</h2>
        <ul class="summary"></ul>
      </section>
      <section>
        <h2>目的</h2>
        <p class="why"></p>
      </section>
      <div class="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <p class="alert-title">気になる点</p>
        <ul class="alert-description concerns"></ul>
      </div>
      <dl class="facts">
        <dt>リスクの理由</dt>
        <dd class="risk-reason"></dd>
        <dt>テスト</dt>
        <dd class="tests-detail"></dd>
      </dl>
    </div>
    <div class="card-footer">
      <div class="actions">
        <button type="button" class="button primary" data-action="request-review">レビュー依頼</button>
        <button type="button" class="button" data-action="return">差し戻し</button>
        <button type="button" class="button ghost" data-action="hold">保留</button>
      </div>
      <div class="links">
        <a class="button pr-link" target="_blank" rel="noopener noreferrer">GitHub で開く<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
        <a class="button artifact-link" target="_blank" rel="noopener noreferrer">変更説明を開く<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
      </div>
    </div>
    <div class="decision" hidden>
      <p class="decision-text"></p>
      <textarea class="reason" rows="3" aria-label="差し戻す理由" placeholder="直してほしいことを書く(PR にコメントします)"></textarea>
      <div class="decision-buttons">
        <button type="button" class="button" data-cancel>やめる</button>
        <button type="button" class="button primary" data-confirm></button>
      </div>
    </div>
    <p class="decision-error" role="alert" hidden></p>
  </details>
</template>
<script>
  const RISKS = {
    low: { label: "リスク 低", tone: "good" },
    medium: { label: "リスク 中", tone: "warn" },
    high: { label: "リスク 高", tone: "bad" },
  };
  const TESTS = {
    passed: { label: "テスト 成功", tone: "good" },
    failed: { label: "テスト 失敗", tone: "bad" },
    not_run: { label: "テスト 未実行", tone: "warn" },
  };
  const CONFIRMATIONS = {
    "request-review": {
      label: "レビューに出す",
      text: (triage) =>
        triage.reviewers.length
          ? `Draft を外し、${triage.reviewers.join("、")} にレビューを頼みます。`
          : "Draft を外して Ready にします。レビュアーの候補はいません。",
    },
    return: {
      label: "差し戻す",
      text: () => "理由を PR にコメントし、差し戻しにします。",
    },
  };
  const receivedFormat = new Intl.DateTimeFormat("ja-JP", {
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
  const tabs = [...document.querySelectorAll(".tabs-trigger")];
  const cards = document.getElementById("cards");
  const message = document.getElementById("message");
  const notice = document.getElementById("notice");
  const template = document.getElementById("card-template");
  const projectTemplate = document.getElementById("project-template");
  const groupSwitch = document.getElementById("group-by-project");
  const GROUPING_KEY = "pr-dashboard:group-by-project";
  let selectedStatus = "pending";
  let triages = [];
  let latestRequest = 0;
  let lastResponse = "";
  let loadError = "";
  let groupByProject = true;
  const runningDecisions = new Set();
  let renderWaiting = false;
  const expanded = new Map();
  const collapsedProjects = new Set();

  function applyGrouping(value) {
    groupByProject = value;
    groupSwitch.setAttribute("aria-checked", String(value));
  }

  function projectKey(status, repo) {
    return `${status} ${repo}`;
  }

  function updateViewState(previouslyReceived) {
    const ids = new Set(triages.map((triage) => triage.id));
    const keys = new Set(triages.map((triage) => projectKey(triage.status, triage.report.repo)));
    for (const id of expanded.keys()) {
      if (!ids.has(id)) {
        expanded.delete(id);
      }
    }
    for (const key of collapsedProjects) {
      if (!keys.has(key)) {
        collapsedProjects.delete(key);
      }
    }
    for (const triage of triages) {
      if (previouslyReceived.get(triage.id) !== triage.received_at) {
        expanded.delete(triage.id);
        collapsedProjects.delete(projectKey(triage.status, triage.report.repo));
      }
    }
  }

  function readGrouping() {
    try {
      return localStorage.getItem(GROUPING_KEY) !== "false";
    } catch (error) {
      console.warn("まとめ方を読み出せませんでした", error);
      return true;
    }
  }

  function rememberGrouping() {
    try {
      localStorage.setItem(GROUPING_KEY, String(groupByProject));
    } catch (error) {
      console.warn("まとめ方を保存できませんでした", error);
    }
  }

  function setText(card, selector, text) {
    card.querySelector(selector).textContent = text;
  }

  function setBadge(card, selector, { label, tone }) {
    const badge = card.querySelector(selector);
    badge.querySelector(".label").textContent = label;
    badge.dataset.tone = tone;
  }

  function setItems(card, selector, items) {
    card.querySelector(selector).replaceChildren(
      ...items.map((item) => Object.assign(document.createElement("li"), { textContent: item })),
    );
  }

  function setMessage(kind, text) {
    message.dataset.kind = kind;
    message.textContent = text;
    message.hidden = text === "";
  }

  function renderCard(triage, open) {
    const card = template.content.firstElementChild.cloneNode(true);
    const { report } = triage;
    const { changes } = report;
    card.open = expanded.get(triage.id) ?? open;
    card.addEventListener("toggle", () => expanded.set(triage.id, card.open));
    setText(card, ".repo-name", report.repo);
    setText(card, ".number", `#${report.number}`);
    setText(card, ".title", report.title);
    setText(
      card,
      ".stats",
      `+${changes.additions} −${changes.deletions} · ${changes.files} ファイル · ${report.branch} · ${receivedFormat.format(new Date(triage.received_at))} 受信`,
    );
    setBadge(card, ".risk", RISKS[report.risk]);
    setBadge(card, ".tests", TESTS[report.tests.status]);
    setItems(card, ".summary", report.summary);
    setText(card, ".why", report.why);
    setItems(card, ".concerns", report.concerns.length ? report.concerns : ["なし"]);
    setText(card, ".risk-reason", report.risk_reason);
    setText(card, ".tests-detail", report.tests.detail);
    card.querySelector(".pr-link").href = report.url;
    const artifactLink = card.querySelector(".artifact-link");
    if (report.artifact_url) {
      artifactLink.href = report.artifact_url;
    } else {
      artifactLink.remove();
    }
    setUpDecisions(card, triage);
    return card;
  }

  async function postDecision(triage, action, reason) {
    const response = await fetch(`/api/prs/${triage.id}/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ seen: triage.received_at, reason }),
    });
    if (!response.ok) {
      const problem = await response.json().catch(() => ({}));
      throw Object.assign(new Error(problem.error ?? `HTTP ${response.status}`), {
        status: response.status,
      });
    }
    return response.json();
  }

  function renderUnlessEditing() {
    if (runningDecisions.size > 0 || cards.querySelector(".decision:not([hidden])")) {
      renderWaiting = true;
      return;
    }
    render();
  }

  function setUpDecisions(card, triage) {
    const actions = card.querySelector(".actions");
    const panel = card.querySelector(".decision");
    const reason = panel.querySelector(".reason");
    const confirm = panel.querySelector("[data-confirm]");
    const error = card.querySelector(".decision-error");
    if (triage.actions.length === 0) {
      actions.remove();
      panel.remove();
      error.remove();
      return;
    }
    for (const button of actions.querySelectorAll("button")) {
      if (!triage.actions.includes(button.dataset.action)) {
        button.remove();
      }
    }

    function setBusy(busy) {
      for (const button of card.querySelectorAll(".actions button, .decision button")) {
        button.disabled = busy;
      }
    }

    async function run(action) {
      setBusy(true);
      error.hidden = true;
      notice.hidden = true;
      runningDecisions.add(triage.id);
      try {
        const decision = await postDecision(triage, action, reason.value);
        panel.hidden = true;
        notice.textContent = decision.warning;
        notice.hidden = decision.warning === "";
      } catch (problem) {
        const text = `できませんでした: ${problem.message}`;
        if (problem.status !== 409 && card.isConnected) {
          error.textContent = text;
          error.hidden = false;
          setBusy(false);
          return;
        }
        panel.hidden = true;
        notice.textContent = text;
        notice.hidden = false;
        renderWaiting = true;
      } finally {
        runningDecisions.delete(triage.id);
      }
      await refresh();
    }

    if (runningDecisions.has(triage.id)) {
      setBusy(true);
    }

    for (const button of actions.querySelectorAll("button")) {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "hold") {
          run(action);
          return;
        }
        panel.dataset.action = action;
        setText(panel, ".decision-text", CONFIRMATIONS[action].text(triage));
        confirm.textContent = CONFIRMATIONS[action].label;
        reason.hidden = action !== "return";
        error.hidden = true;
        panel.hidden = false;
        (action === "return" ? reason : confirm).focus();
      });
    }
    confirm.addEventListener("click", () => run(panel.dataset.action));
    panel.querySelector("[data-cancel]").addEventListener("click", () => {
      panel.hidden = true;
      if (renderWaiting) {
        renderUnlessEditing();
      }
    });
  }

  function renderProject(repo, projectCards, key) {
    const project = projectTemplate.content.firstElementChild.cloneNode(true);
    const slash = repo.indexOf("/");
    project.open = !collapsedProjects.has(key);
    project.addEventListener("toggle", () => {
      if (project.open) {
        collapsedProjects.delete(key);
      } else {
        collapsedProjects.add(key);
      }
    });
    setText(project, ".project-owner", repo.slice(0, slash + 1));
    setText(project, ".project-name", repo.slice(slash + 1));
    setText(project, ".project-count", projectCards.length);
    project.querySelector(".project-cards").replaceChildren(...projectCards);
    return project;
  }

  function renderProjects(shown, status, firstOpen) {
    const projects = new Map();
    for (const triage of shown) {
      const repo = triage.report.repo;
      if (!projects.has(repo)) {
        projects.set(repo, []);
      }
      projects.get(repo).push(triage);
    }
    const repos = [...projects.keys()].sort((a, b) => a.localeCompare(b));
    return repos.map((repo) =>
      renderProject(
        repo,
        projects.get(repo).map((triage) => renderCard(triage, triage === firstOpen)),
        projectKey(status, repo),
      ),
    );
  }

  function render() {
    renderWaiting = false;
    for (const tab of tabs) {
      const status = tab.dataset.status;
      tab.setAttribute("aria-pressed", String(status === selectedStatus));
      tab.querySelector(".count").textContent = triages.filter((t) => t.status === status).length;
    }
    const shown = triages.filter((triage) => triage.status === selectedStatus);
    const firstOpen = shown.find(
      (triage) =>
        !groupByProject || !collapsedProjects.has(projectKey(selectedStatus, triage.report.repo)),
    );
    cards.className = groupByProject ? "project-list" : "card-list";
    cards.replaceChildren(
      ...(groupByProject
        ? renderProjects(shown, selectedStatus, firstOpen)
        : shown.map((triage) => renderCard(triage, triage === firstOpen))),
    );
    if (loadError) {
      setMessage("error", `読み込めませんでした: ${loadError}`);
    } else {
      setMessage("empty", shown.length ? "" : "このタブに PR はありません");
    }
  }

  async function refresh() {
    const request = ++latestRequest;
    try {
      const response = await fetch("/api/prs");
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const text = await response.text();
      if (request !== latestRequest || (text === lastResponse && !loadError && !renderWaiting)) {
        return;
      }
      const previouslyReceived = new Map(triages.map((triage) => [triage.id, triage.received_at]));
      lastResponse = text;
      triages = JSON.parse(text);
      loadError = "";
      updateViewState(previouslyReceived);
      renderUnlessEditing();
    } catch (error) {
      if (request !== latestRequest) {
        return;
      }
      loadError = error.message;
      renderUnlessEditing();
    }
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => {
      selectedStatus = tab.dataset.status;
      render();
    });
  }
  applyGrouping(readGrouping());
  groupSwitch.addEventListener("click", () => {
    applyGrouping(!groupByProject);
    rememberGrouping();
    render();
  });
  window.addEventListener("storage", (event) => {
    if (event.key === GROUPING_KEY) {
      applyGrouping(event.newValue !== "false");
      render();
    }
  });
  window.addEventListener("focus", refresh);
  refresh();
</script>
</body>
</html>
